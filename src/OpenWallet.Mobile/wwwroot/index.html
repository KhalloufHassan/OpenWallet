<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>OpenWallet</title>
    <base href="/" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="_content/OpenWallet.UI/css/openwallet.css" />
    <link rel="stylesheet" href="OpenWallet.Mobile.styles.css" />
</head>

<body>
    <div id="app">
        <div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#adb5bd;font-family:sans-serif;gap:.75rem;background:#0d1117;">
            <span style="width:1.5rem;height:1.5rem;border:3px solid #0d6efd;border-top-color:transparent;border-radius:50%;display:inline-block;animation:ow-spin 0.7s linear infinite;"></span>
            Loading OpenWallet…
            <style>@keyframes ow-spin{to{transform:rotate(360deg)}}</style>
        </div>
    </div>

    <div id="blazor-error-ui" data-nosnippet style="display:none;position:fixed;bottom:0;width:100%;background:#da3633;color:#fff;padding:.5rem 1.25rem;z-index:9999;">
        An unhandled error has occurred. <a href="" class="reload" style="color:#fff;font-weight:600;">Reload</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script src="_content/OpenWallet.UI/js/charts.js"></script>
    <script src="_content/OpenWallet.UI/js/auth.js"></script>
    <script src="_content/OpenWallet.UI/js/files.js"></script>
    <script src="_framework/blazor.webview.js" autostart="false"></script>
</body>

</html>
